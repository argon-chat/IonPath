# Publishes the ionpath.* packages to nuget.org using Trusted Publishing (OIDC).
#
# There is no long-lived NuGet API key: NuGet/login exchanges the GitHub OIDC token this job
# requests for a temporary API key (valid for one hour). That requires three things to line up.
#
#   1. `id-token: write` below. Without it there is no OIDC token to exchange.
#   2. A Trusted Publishing policy on nuget.org pointing at this repository and at this workflow
#      *by filename*. That is why the file is named `release.yaml` and why renaming it silently
#      breaks publishing — nuget.org matches the filename, not the workflow name.
#   3. The `NUGET_USER` secret: the nuget.org username of the account that *created* the policy.
#      Not the package owner (`ArgonChat`) — the token exchange rejects that with a 401.

name: Publish NuGet Packages

on:
  push:
    paths:
      - "src/ion.runtime/**"
      - "src/ion.runtime.client/**"
      - "src/ion.runtime.network/**"
      - "src/ion.compiler/**"
      - "src/ionc/**"
      - "GitVersion.yml"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required — this is what trusted publishing exchanges

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack ion.runtime
        run: dotnet pack src/ion.runtime/ion.runtime.csproj -c Release -o ./nupkgs

      - name: Pack ion.runtime.client
        run: dotnet pack src/ion.runtime.client/ion.runtime.client.csproj -c Release -o ./nupkgs

      - name: Pack ion.runtime.network
        run: dotnet pack src/ion.runtime.network/ion.runtime.network.csproj -c Release -o ./nupkgs

      - name: Pack ion.compiler (tool and MSBuild SDK)
        run: dotnet pack src/ionc/ionc.csproj -c Release -o ./nupkgs

      - name: NuGet login (OIDC → temporary API key)
        # Requested after packing, not at the start of the job: the key expires after an hour.
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        # No `|| true`: `--skip-duplicate` already covers an unchanged version, so anything else
        # that fails here — a rejected key, a policy mismatch — must fail the run, not pass green.
        run: |
          for pkg in ./nupkgs/*.nupkg; do
            echo "Publishing $pkg"
            dotnet nuget push "$pkg" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
