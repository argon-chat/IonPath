# Publishes the ionpath.* packages to nuget.org using Trusted Publishing (OIDC).
#
# There is no long-lived NuGet API key: NuGet/login exchanges the GitHub OIDC token this job
# requests for a temporary API key (valid for one hour). That requires three things to line up.
#
#   1. `id-token: write` below. Without it there is no OIDC token to exchange.
#   2. A Trusted Publishing policy on nuget.org pointing at this repository and at this workflow
#      *by filename*. That is why the file is named `release.yaml` and why renaming it silently
#      breaks publishing — nuget.org matches the filename, not the workflow name.
#   3. The `NUGET_USER` secret: the nuget.org username of the account that *created* the policy.
#      Not the package owner (`ArgonChat`) — the token exchange rejects that with a 401.

name: Publish NuGet Packages

on:
  push:
    branches:
      - master
    paths:
      - "src/ion.runtime/**"
      - "src/ion.runtime.client/**"
      - "src/ion.runtime.network/**"
      - "src/ion.runtime.network.redis/**"
      - "src/ion.runtime.streams/**"
      - "src/ion.compiler/**"
      - "src/ionc/**"
      - "GitVersion.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and pack, but do not publish"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required — this is what trusted publishing and the Codecov upload exchange

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Install msquic
        # WebTransport runs over System.Net.Quic, which on Linux needs libmsquic; without it every
        # WebTransport-parametrised stream test fails with "no configured transport can reach".
        run: |
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y libmsquic

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install ion.webcore.js dependencies
        # The JS interop test runs the package's vitest suite against the real server.
        run: bun install --frozen-lockfile
        working-directory: packages/ion.webcore.js

      - name: Test (with coverage)
        # Before packing, so a failing test never reaches nuget.org. The Dragonfly backplane tests
        # need Docker, which ubuntu-latest has. A hung test is killed and named instead of holding the
        # job until GitHub's six-hour limit.
        timeout-minutes: 30
        run: >-
          dotnet test --configuration Release --no-build
          --settings coverage.runsettings
          --collect "XPlat Code Coverage"
          --blame-hang-timeout 5m --blame-hang-dump-type none
          --results-directory ./TestResults

      - name: Upload coverage to Codecov
        # Authenticates through GitHub OIDC, like NuGet/login — no CODECOV_TOKEN secret.
        # `fail_ci_if_error` with `continue-on-error`: a failed upload shows as a red step instead of
        # passing silently, but a Codecov outage does not hold back a release.
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          directory: ./TestResults
          flags: dotnet
          fail_ci_if_error: true

      - name: Pack ion.runtime
        run: dotnet pack src/ion.runtime/ion.runtime.csproj -c Release -o ./nupkgs

      - name: Pack ion.runtime.client
        run: dotnet pack src/ion.runtime.client/ion.runtime.client.csproj -c Release -o ./nupkgs

      - name: Pack ion.runtime.streams
        run: dotnet pack src/ion.runtime.streams/ion.runtime.streams.csproj -c Release -o ./nupkgs

      - name: Pack ion.runtime.network
        run: dotnet pack src/ion.runtime.network/ion.runtime.network.csproj -c Release -o ./nupkgs

      - name: Pack ion.runtime.network.redis
        run: dotnet pack src/ion.runtime.network.redis/ion.runtime.network.redis.csproj -c Release -o ./nupkgs

      - name: Pack ion.compiler (tool and MSBuild SDK)
        run: dotnet pack src/ionc/ionc.csproj -c Release -o ./nupkgs

      - name: NuGet login (OIDC → temporary API key)
        # Requested after packing, not at the start of the job: the key expires after an hour.
        if: ${{ !inputs.dry_run }}
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        # No `|| true`: `--skip-duplicate` already covers an unchanged version, so anything else
        # that fails here — a rejected key, a policy mismatch — must fail the run, not pass green.
        if: ${{ !inputs.dry_run }}
        run: |
          for pkg in ./nupkgs/*.nupkg; do
            echo "Publishing $pkg"
            dotnet nuget push "$pkg" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
