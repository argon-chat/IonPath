[package]
name = "ion-rustcore"
version = "0.2.0"
edition = "2021"
description = "IonPath runtime library for Rust clients — CBOR-based RPC with unary and streaming support"
license = "MIT"
repository = "https://github.com/argon-chat/IonPath"
homepage = "https://github.com/argon-chat/IonPath"
keywords = ["rpc", "cbor", "codegen", "ion"]
categories = ["network-programming", "encoding"]
readme = "README.md"

[dependencies]
minicbor = { version = "2", features = ["std", "half"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "2"
base64 = "0.22"

[dev-dependencies]
# only used to read the shared cross-runtime vectors in /tests/golden
serde_json = "1"
# tests/float_golden.rs builds f2 values from their IEEE bit patterns; `half` is already in the
# tree as minicbor's "half" feature dependency.
half = "2"
# tests/streaming_v2.rs runs an in-process WebSocket server on a multi-threaded runtime.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util"] }
